# ============================================================
# Alembic configuration — CLH Backend (MySQL / XAMPP)
# ============================================================
# NOTE: The actual database URL is injected programmatically
# in alembic/env.py from app.core.config.get_settings(). The
# `sqlalchemy.url` line below MUST stay empty.
# ============================================================

[alembic]
# Path to the migration scripts directory
script_location = alembic

# Prepend the project root to sys.path so `import app` works
prepend_sys_path = .

# Use OS-specific path separator for version_locations
version_path_separator = os

# ------------------------------------------------------------------
# Database URL — intentionally empty.
# Set at runtime in alembic/env.py from Settings.database_url_sync
# ------------------------------------------------------------------
sqlalchemy.url =

# Optional: where generated migration files are placed
# (defaults to <script_location>/versions — leave commented)
# version_locations = %(here)s/alembic/versions

# Optional: file template (we ship a custom one at alembic/script.py.mako)
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file_template timestamps
# timezone = UTC

# Truncate long slug names in filenames
# truncate_slug_length = 40

# Render `__init__.py` in versions directory (not needed here)
# recursive_version_locations = false


# ============================================================
# Logging configuration
# ============================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

# ------------------------------------------------------------------
# Root logger — quiet by default (warnings and above)
# ------------------------------------------------------------------
[logger_root]
level = WARN
handlers = console
qualname =

# ------------------------------------------------------------------
# SQLAlchemy engine logger
# Set level = INFO to see every SQL statement Alembic executes.
# Useful when debugging MySQL DDL issues.
# ------------------------------------------------------------------
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

# ------------------------------------------------------------------
# Alembic logger
# ------------------------------------------------------------------
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# ------------------------------------------------------------------
# Console handler — writes to stderr
# ------------------------------------------------------------------
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# ------------------------------------------------------------------
# Generic formatter
# ------------------------------------------------------------------
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S